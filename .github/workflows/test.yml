name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install OpenClaw plugin dependencies
        working-directory: extensions/openclaw-ariad
        run: npm install
      - name: Build and validate OpenClaw Ariad plugin
        working-directory: extensions/openclaw-ariad
        run: npm run plugin:validate
