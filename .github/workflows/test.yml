name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pydantic runtime only
        run: pip install -r runtime/pydantic/requirements.txt
      - name: Test standalone runtime without OpenClaw
        run: npm run test:pydantic-runtime

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone Pydantic runtime dependencies
        run: pip install -r runtime/pydantic/requirements.txt
      - run: npm test
      - name: Install OpenClaw plugin dependencies
        working-directory: extensions/openclaw-ariad
        run: npm ci
      - name: Run OpenClaw Ariad plugin unit tests
        working-directory: extensions/openclaw-ariad
        run: npm test
      - name: Build OpenClaw Ariad plugin metadata
        working-directory: extensions/openclaw-ariad
        run: |
          npm run plugin:build
          git diff -- openclaw.plugin.json
          git diff --exit-code -- openclaw.plugin.json
      - name: Validate OpenClaw Ariad plugin
        working-directory: extensions/openclaw-ariad
        run: npm run plugin:validate
      - name: Run Ariad v2 through OpenClaw Gateway
        working-directory: extensions/openclaw-ariad
        run: npm run test:e2e
