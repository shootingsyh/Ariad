name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install OpenClaw plugin dependencies
        working-directory: extensions/openclaw-ariad
        run: npm ci
      - name: Build and validate OpenClaw Ariad plugin
        working-directory: extensions/openclaw-ariad
        run: npm run plugin:validate
      - name: Run Ariad v2 through OpenClaw Gateway
        working-directory: extensions/openclaw-ariad
        run: npm run test:e2e
