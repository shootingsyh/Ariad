name: test
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Bootstrap OpenClaw plugin lockfile
        if: github.event_name == 'push'
        working-directory: extensions/openclaw-ariad
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name "Ariad CI"
            git config user.email "ariad-ci@localhost"
            git add package-lock.json
            git commit -m "build: lock OpenClaw plugin dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Install OpenClaw plugin dependencies
        working-directory: extensions/openclaw-ariad
        run: npm ci
      - name: Test OpenClaw Ariad host/runtime adapters
        working-directory: extensions/openclaw-ariad
        run: npm test
      - name: Build and validate OpenClaw Ariad plugin
        working-directory: extensions/openclaw-ariad
        run: npm run plugin:validate
      - name: Run OpenClaw Gateway against fake provider
        working-directory: extensions/openclaw-ariad
        run: npm run test:e2e
