name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install bundled Pi runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test standalone Pi runtime without OpenClaw
        run: npm run test:pi-runtime

  control-policy-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pi and test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline task permissions and scheduler E2E
        run: node --test test/pi-runtime-config.test.js test/adhoc-control-tasks.test.js test/developer-task-policy.test.js test/pi-agent-session-e2e.test.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install bundled Node runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install standalone Pydantic runtime dependencies
        run: pip install -r runtime/pydantic/requirements.txt
      - run: npm test
      - name: Install OpenClaw plugin dependencies
        working-directory: extensions/openclaw-ariad
        run: npm ci
      - name: Run OpenClaw Ariad plugin unit tests
        working-directory: extensions/openclaw-ariad
        run: npm test
      - name: Build OpenClaw Ariad plugin metadata
        working-directory: extensions/openclaw-ariad
        run: |
          npm run plugin:build
          git diff -- openclaw.plugin.json
          git diff --exit-code -- openclaw.plugin.json
      - name: Validate OpenClaw Ariad plugin
        working-directory: extensions/openclaw-ariad
        run: npm run plugin:validate
